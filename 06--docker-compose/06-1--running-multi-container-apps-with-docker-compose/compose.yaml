services:
  app:
    build:
      context: ./app
    networks:
      - app-net
    volumes:
      - app-data:/data
    depends_on:
      data-service:
        condition: service_healthy

  data-service:
    build:
      context: ./data-service
    networks:
      - app-net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 2s
      timeout: 1s
      retries: 10

networks:
  app-net:

volumes:
  app-data: